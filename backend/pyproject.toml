[project]
name = "audiohelper"
version = "0.1.0"
description = "AudioHelper local backend: audio ingestion, ASR, temporal agent, notes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "cryptography>=43",
    "websockets>=15.0,<16",
]

[project.optional-dependencies]
local-asr = ["faster-whisper>=1.0"]
local-gigachat-mlx = [
    "gigachat-audio-mlx==0.1.4; python_version >= '3.12' and python_version < '3.14'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audiohelper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:audiohelper.*"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# The product speaks Russian: Cyrillic in strings and docstrings is intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# FastAPI expresses query validation through call defaults.
"src/audiohelper/routes/*.py" = ["B008"]

[[tool.mypy.overrides]]
# Optional local-ASR extras are not installed in the default dev environment.
module = ["faster_whisper.*", "numpy.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
