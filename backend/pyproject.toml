[project]
name = "skaz"
version = "0.4.0b1"
description = "SKAZ local backend: audio ingestion, ASR, temporal agent, notes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "certifi>=2026.10.19",
    "cryptography>=43",
    "websockets>=15.0,<18",
    "pypdf>=6.21.4",
    "readability-lxml>=0.9",
    "fsrs==6.3.2",
    "pypdfium2>=5,<6",
    "pillow>=12",
    "pillow-heif>=1,<2",
    "onnxruntime>=1.18",
    "tokenizers>=0.20",
    "numpy>=1.26",
]

[project.optional-dependencies]
local-asr = ["faster-whisper>=1.0"]
local-gigachat-mlx = [
    "gigachat-audio-mlx==0.1.4; python_version >= '3.12' and python_version < '3.14'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skaz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:skaz.*"]

[tool.ruff]
extend-exclude = ["src/skaz/knowledge/extensions/hermes_guard"]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# The product speaks Russian: Cyrillic in strings and docstrings is intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# FastAPI expresses query validation through call defaults.
"src/skaz/routes/*.py" = ["B008"]

[[tool.mypy.overrides]]
# Pinned third-party source, checked at its SKAZ adapter boundary.
module = "skaz.knowledge.extensions.hermes_guard.*"
ignore_errors = true

[[tool.mypy.overrides]]
# Optional local-ASR extras are not installed in the default dev environment.
module = ["faster_whisper.*", "numpy.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
